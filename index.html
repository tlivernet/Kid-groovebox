<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Ma Groovebox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Une petite groovebox tactile pour inventer de la musique.">
  <meta name="theme-color" content="#12121c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Groovebox">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="start-screen">
    <h1>Ma Groovebox</h1>
    <button id="start-btn"><span class="start-icon"></span><span>C'est parti&nbsp;!</span></button>
    <p class="hint">Monte le son et mets la tablette à l'horizontale.</p>
  </div>

  <header>
    <div id="styles" class="bar"></div>
    <div id="keys" class="bar"></div>
  </header>

  <nav id="controlbar">
    <div id="views" class="seg"></div>
    <div id="phrases"></div>
    <div id="phrase-tools"></div>
  </nav>

  <main>
    <section id="view-motif" class="view">
      <div id="grid"></div>
    </section>

    <section id="view-live" class="view hidden">
      <div id="fx"></div>
      <div id="live-bottom">
        <div id="live-side">
          <div id="live-instruments"></div>
          <div id="octave-wrap">
            <div id="octave"></div>
            <div id="octave-value"></div>
          </div>
        </div>
        <div id="keyboard"></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="transport">
      <button id="play" class="big-btn" aria-label="Départ / arrêt"></button>
      <button id="surprise" class="small-btn" aria-label="Surprise"></button>
      <button id="clear" class="small-btn" aria-label="Effacer la phrase"></button>
    </div>
    <div id="knobs"></div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
